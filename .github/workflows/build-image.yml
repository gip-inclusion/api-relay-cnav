name: Build image

# Once the CI passed on a commit of main: build and push its image, then request its deployment in integration
# gip-inclusion/emplois-cnav-ops opens (or updates) the pull request pinning it: merging it deploys
on:
  workflow_run:
    workflows:
      - "🔮 CI"
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REGISTRY: rg.fr-par.scw.cloud
      IMAGE: rg.fr-par.scw.cloud/emplois-cnav-registry/api-relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Compute the image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Log in to the Scaleway registry
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_REGISTRY_SECRET_KEY }}
        run: docker login "$REGISTRY" --username nologin --password-stdin <<< "$SCW_SECRET_KEY"

      - name: Build and push the image
        run: >
          docker buildx build --platform linux/amd64 --target final_image --file docker/django/Dockerfile
          --tag "$IMAGE:$IMAGE_TAG" --tag "$IMAGE:latest" --push .

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPLOY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_BOT_PRIVATE_KEY }}
          owner: gip-inclusion
          repositories: emplois-cnav-ops

      - name: Request the deployment in integration
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >
          gh api repos/gip-inclusion/emplois-cnav-ops/dispatches
          --raw-field event_type=api-relay-image --raw-field "client_payload[tag]=$IMAGE_TAG"
